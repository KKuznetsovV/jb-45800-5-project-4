server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream hostnames dynamically via Docker's embedded DNS
    # (avoids nginx failing to start if "backend" isn't resolvable yet
    # at config-load time).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
